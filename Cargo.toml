[package]
name = "stdint"
version = "1.1.0"
authors = ["Markus Mayer <widemeadows@gmail.com>", "Vojtech Kral <vojtech@kral.hk>"]
license = "BSD-2-Clause"
description = "C99 stdint integer types for easier interop"
homepage = "https://github.com/sunsided/stdint-rs"
repository = "https://github.com/sunsided/stdint-rs"
readme = "README.md"
keywords = ["C99", "types", "stdint"]
categories = ["hardware-support", "no-std"]
build = "build.rs"
edition = "2021"
rust-version = "1.77.0"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = []

[build-dependencies]
cc = "1"
